<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#7257ff" />
  <title>人生選擇器｜Life Decision Randomizer</title>
  <style>
    :root {
      --bg-1: #f8f7ff;
      --bg-2: #eef7ff;
      --surface: rgba(255, 255, 255, 0.86);
      --surface-solid: #ffffff;
      --text: #241f38;
      --muted: #746e8b;
      --line: rgba(93, 79, 145, 0.14);
      --primary: #7257ff;
      --primary-2: #9a72ff;
      --accent: #ff7eb6;
      --success: #2cad79;
      --danger: #e05270;
      --shadow: 0 20px 55px rgba(69, 52, 133, 0.14);
      --shadow-soft: 0 10px 28px rgba(69, 52, 133, 0.1);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: ui-rounded, "SF Pro Rounded", "PingFang TC", "Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 12%, rgba(154, 114, 255, 0.17), transparent 27%),
        radial-gradient(circle at 88% 18%, rgba(255, 126, 182, 0.16), transparent 24%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
      overflow-x: hidden;
    }

    button, input { font: inherit; }

    button {
      border: 0;
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    .tool-card:focus-visible {
      outline: 3px solid rgba(114, 87, 255, 0.35);
      outline-offset: 3px;
    }

    .app-shell {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      padding: 14px 0 8px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.66);
      box-shadow: 0 8px 30px rgba(73, 58, 120, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(145deg, var(--primary), var(--primary-2));
      box-shadow: 0 8px 20px rgba(114, 87, 255, 0.26);
    }

    .brand span:last-child { font-size: 1.02rem; }

    .back-home {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 12px;
      background: #f2efff;
      color: #5b43d8;
      font-weight: 800;
      transition: transform .18s ease, background .18s ease;
    }

    .back-home:hover { transform: translateY(-1px); background: #ece7ff; }
    .back-home.show { display: inline-flex; }

    main { flex: 1; }

    .view {
      display: none;
      animation: fadeUp .34s ease both;
    }

    .view.active { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero {
      text-align: center;
      padding: 74px 12px 40px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .72);
      color: #655c7b;
      font-size: .9rem;
      font-weight: 750;
    }

    h1, h2, h3, p { margin-top: 0; }

    .hero h1 {
      margin-bottom: 14px;
      font-size: clamp(2.4rem, 7vw, 4.8rem);
      line-height: 1;
      letter-spacing: -0.055em;
      background: linear-gradient(125deg, #2f2850 12%, #7257ff 56%, #b45ddc 94%);
      -webkit-background-clip: text;
      color: transparent;
    }

    .hero p {
      margin-bottom: 0;
      color: var(--muted);
      font-size: clamp(1.02rem, 2.2vw, 1.24rem);
      font-weight: 650;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      padding: 12px 0 72px;
    }

    .tool-card {
      position: relative;
      overflow: hidden;
      min-height: 330px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      border: 1px solid rgba(255, 255, 255, 0.88);
      border-radius: var(--radius-xl);
      background: var(--surface);
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform .24s ease, box-shadow .24s ease;
      isolation: isolate;
    }

    .tool-card::after {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      right: -58px;
      bottom: -68px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(114, 87, 255, 0.17), transparent 68%);
      z-index: -1;
    }

    .tool-card:hover {
      transform: translateY(-7px) rotate(-0.25deg);
      box-shadow: 0 28px 70px rgba(69, 52, 133, 0.19);
    }

    .card-icon {
      width: 74px;
      height: 74px;
      display: grid;
      place-items: center;
      margin-bottom: 30px;
      border-radius: 22px;
      font-size: 2.35rem;
      background: linear-gradient(145deg, #f1eeff, #fff);
      box-shadow: inset 0 0 0 1px rgba(114, 87, 255, .08), 0 12px 24px rgba(80, 61, 153, .11);
      transition: transform .24s ease;
    }

    .tool-card:hover .card-icon { transform: scale(1.06) rotate(5deg); }

    .tool-card h2 {
      margin-bottom: 10px;
      font-size: 1.55rem;
      letter-spacing: -.025em;
    }

    .tool-card p {
      min-height: 48px;
      margin-bottom: 28px;
      color: var(--muted);
      line-height: 1.7;
    }

    .card-action,
    .primary-btn,
    .secondary-btn,
    .ghost-btn {
      min-height: 48px;
      border-radius: 14px;
      font-weight: 850;
      transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
    }

    .card-action {
      margin-top: auto;
      width: 100%;
      padding: 13px 18px;
      color: #fff;
      background: linear-gradient(125deg, var(--primary), var(--primary-2));
      box-shadow: 0 10px 24px rgba(114, 87, 255, .24);
    }

    .primary-btn {
      padding: 13px 20px;
      color: #fff;
      background: linear-gradient(125deg, var(--primary), var(--primary-2));
      box-shadow: 0 10px 24px rgba(114, 87, 255, .23);
    }

    .primary-btn:hover, .card-action:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(114, 87, 255, .29); }
    .primary-btn:active, .card-action:active { transform: translateY(0); }

    .secondary-btn {
      padding: 13px 20px;
      color: #5d47d7;
      background: #f0edff;
    }

    .secondary-btn:hover { transform: translateY(-2px); }

    .ghost-btn {
      padding: 12px 18px;
      color: var(--text);
      background: #f5f3fb;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .58;
      transform: none !important;
      box-shadow: none !important;
    }

    .tool-page {
      padding: 38px 0 70px;
    }

    .page-title {
      text-align: center;
      margin-bottom: 26px;
    }

    .page-title .emoji { font-size: 2.25rem; }
    .page-title h1 { margin: 8px 0 8px; font-size: clamp(2rem, 5vw, 3.25rem); letter-spacing: -.04em; }
    .page-title p { margin: 0; color: var(--muted); }

    .panel {
      padding: clamp(18px, 3vw, 30px);
      border: 1px solid rgba(255, 255, 255, .86);
      border-radius: var(--radius-xl);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .wheel-layout {
      display: grid;
      grid-template-columns: minmax(300px, .92fr) minmax(360px, 1.08fr);
      gap: 28px;
      align-items: stretch;
    }

    .input-label {
      display: block;
      margin-bottom: 8px;
      font-size: .9rem;
      color: #665f78;
      font-weight: 800;
    }

    .input-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }

    .text-input {
      width: 100%;
      min-height: 48px;
      padding: 0 15px;
      color: var(--text);
      border: 1px solid #ddd7f2;
      border-radius: 13px;
      outline: none;
      background: rgba(255, 255, 255, .95);
      transition: border .18s ease, box-shadow .18s ease;
    }

    .text-input:focus {
      border-color: rgba(114, 87, 255, .58);
      box-shadow: 0 0 0 4px rgba(114, 87, 255, .1);
    }

    .inline-note {
      min-height: 22px;
      margin: 10px 0 8px;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 650;
    }

    .inline-note.error { color: var(--danger); }
    .inline-note.success { color: var(--success); }

    .option-list {
      display: grid;
      gap: 9px;
      margin-top: 16px;
      max-height: 376px;
      overflow: auto;
      padding-right: 4px;
    }

    .option-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 12px 11px 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255, 255, 255, .82);
      animation: popIn .22s ease;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(.97); }
      to { opacity: 1; transform: scale(1); }
    }

    .option-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 750;
    }

    .delete-option {
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: #9a5368;
      background: #fff0f4;
      font-size: 1.05rem;
      font-weight: 900;
      transition: transform .15s ease, background .15s ease;
    }

    .delete-option:hover { transform: rotate(8deg) scale(1.04); background: #ffe4ec; }

    .empty-state {
      padding: 24px 12px;
      text-align: center;
      color: #8b849e;
      border: 1px dashed #d8d1ef;
      border-radius: 14px;
      background: rgba(255, 255, 255, .46);
    }

    .wheel-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 580px;
    }

    .wheel-wrap {
      position: relative;
      width: min(100%, 510px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
    }

    #wheelCanvas {
      display: block;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 18px 24px rgba(55, 44, 105, .17));
    }

    .wheel-pointer {
      position: absolute;
      top: -4px;
      left: 50%;
      z-index: 4;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 42px solid #2f2850;
      border-bottom: 0;
      filter: drop-shadow(0 6px 5px rgba(39, 31, 77, .18));
    }

    .wheel-hub {
      position: absolute;
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border: 6px solid #fff;
      border-radius: 50%;
      background: linear-gradient(145deg, #7761ff, #9b79ff);
      color: #fff;
      font-size: 1.3rem;
      box-shadow: 0 7px 16px rgba(66, 49, 135, .22);
      pointer-events: none;
    }

    .wheel-actions { width: min(100%, 330px); }
    .wheel-actions .primary-btn { width: 100%; }

    .center-card {
      width: min(680px, 100%);
      margin: 0 auto;
      text-align: center;
    }

    .dice-stage, .coin-stage {
      min-height: 450px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    .dice {
      width: clamp(160px, 33vw, 230px);
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      align-items: center;
      justify-items: center;
      padding: 19px;
      border-radius: 32px;
      background: linear-gradient(145deg, #ffffff, #f1eff8);
      box-shadow:
        inset -10px -10px 22px rgba(80, 67, 122, .08),
        inset 7px 7px 14px rgba(255, 255, 255, .9),
        0 25px 45px rgba(51, 40, 95, .2);
      transform-origin: center;
    }

    .dice.rolling { animation: diceRoll 0.52s linear infinite; }

    @keyframes diceRoll {
      0% { transform: translateY(0) rotate(0deg) scale(1); }
      25% { transform: translateY(-18px) rotate(75deg) scale(1.03); }
      52% { transform: translateY(1px) rotate(170deg) scale(.98); }
      78% { transform: translateY(-9px) rotate(255deg) scale(1.02); }
      100% { transform: translateY(0) rotate(360deg) scale(1); }
    }

    .pip {
      width: clamp(20px, 4vw, 28px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: linear-gradient(145deg, #3d345f, #231d3d);
      box-shadow: inset 2px 2px 3px rgba(255, 255, 255, .16), 0 3px 5px rgba(41, 32, 74, .18);
      opacity: 0;
      transform: scale(.35);
      transition: opacity .1s ease, transform .1s ease;
    }

    .pip.show { opacity: 1; transform: scale(1); }

    .result-card {
      width: min(430px, 100%);
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 255, 255, .73);
      text-align: center;
      opacity: 0;
      transform: translateY(8px) scale(.985);
      pointer-events: none;
      transition: opacity .24s ease, transform .24s ease;
    }

    .result-card.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .result-kicker { margin: 0 0 6px; color: var(--muted); font-weight: 750; }
    .result-value { margin: 0 0 18px; font-size: clamp(2.4rem, 9vw, 4rem); line-height: 1; font-weight: 950; letter-spacing: -.04em; }

    .coin-inputs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 8px;
      text-align: left;
    }

    .coin-scene {
      width: clamp(180px, 38vw, 250px);
      aspect-ratio: 1;
      perspective: 1100px;
    }

    .coin {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 1.55s cubic-bezier(.18,.74,.18,1);
    }

    .coin-side {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      border: 10px solid #d49a2e;
      box-shadow:
        inset 0 0 0 8px rgba(255,255,255,.2),
        inset -12px -12px 28px rgba(122, 79, 7, .16),
        0 22px 40px rgba(80, 56, 21, .2);
    }

    .coin-front {
      color: #744500;
      background:
        radial-gradient(circle at 34% 28%, rgba(255,255,255,.64), transparent 22%),
        linear-gradient(145deg, #ffe38e, #f7bb43 65%, #d99523);
    }

    .coin-back {
      transform: rotateY(180deg);
      color: #7b4b00;
      background:
        radial-gradient(circle at 34% 28%, rgba(255,255,255,.52), transparent 22%),
        linear-gradient(145deg, #f9d36a, #e8a52f 68%, #c77a14);
    }

    .coin-face-inner {
      width: 64%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 3px solid rgba(119, 71, 0, .37);
      border-radius: 50%;
      font-size: clamp(3rem, 8vw, 4.9rem);
      font-weight: 950;
      line-height: 1;
      text-shadow: 0 2px 0 rgba(255,255,255,.42);
    }

    .coin-result-name {
      margin: 0 0 8px;
      font-weight: 850;
      color: #776f8d;
      font-size: 1.1rem;
    }

    .coin-result-choice {
      margin: 0 0 18px;
      font-size: clamp(1.75rem, 6vw, 2.75rem);
      line-height: 1.16;
      font-weight: 950;
      overflow-wrap: anywhere;
    }

    .footer {
      padding: 26px 0 34px;
      text-align: center;
      color: #8a8499;
      font-size: .86rem;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(31, 24, 56, .45);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      opacity: 0;
      visibility: hidden;
      transition: opacity .2s ease, visibility .2s ease;
    }

    .modal-backdrop.open { opacity: 1; visibility: visible; }

    .modal {
      width: min(470px, 100%);
      padding: 30px;
      border: 1px solid rgba(255,255,255,.88);
      border-radius: 28px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 30px 80px rgba(39, 30, 74, .28);
      text-align: center;
      transform: translateY(12px) scale(.97);
      transition: transform .22s ease;
    }

    .modal-backdrop.open .modal { transform: translateY(0) scale(1); }
    .modal-emoji { font-size: 2.6rem; margin-bottom: 8px; }
    .modal h3 { margin: 0 0 7px; font-size: 1.15rem; color: var(--muted); }
    .modal-result {
      margin: 8px 0 24px;
      font-size: clamp(2rem, 7vw, 3.25rem);
      line-height: 1.12;
      font-weight: 950;
      overflow-wrap: anywhere;
      letter-spacing: -.035em;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 900px) {
      .tool-grid { grid-template-columns: 1fr; max-width: 620px; margin: 0 auto; }
      .tool-card { min-height: 260px; }
      .wheel-layout { grid-template-columns: 1fr; }
      .wheel-panel { min-height: unset; }
    }

    @media (max-width: 620px) {
      .app-shell { width: min(100% - 18px, 1180px); }
      .topbar { padding-top: 8px; }
      .topbar-inner { padding: 10px 12px; }
      .brand-mark { width: 34px; height: 34px; }
      .brand span:last-child { font-size: .94rem; }
      .back-home { padding: 9px 10px; font-size: .9rem; }
      .hero { padding-top: 50px; }
      .tool-grid { gap: 14px; padding-bottom: 48px; }
      .tool-card { padding: 22px; min-height: 240px; }
      .card-icon { margin-bottom: 20px; }
      .tool-page { padding-top: 26px; }
      .panel { border-radius: 22px; }
      .wheel-wrap { width: min(100%, 430px); }
      .wheel-pointer { border-left-width: 14px; border-right-width: 14px; border-top-width: 34px; }
      .wheel-hub { width: 50px; height: 50px; border-width: 5px; font-size: 1.15rem; }
      .coin-inputs { grid-template-columns: 1fr; }
      .dice-stage, .coin-stage { min-height: 390px; }
      .modal-actions { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar" aria-label="網站導覽">
      <div class="topbar-inner">
        <div class="brand" aria-label="人生選擇器">
          <span class="brand-mark" aria-hidden="true">✨</span>
          <span>人生選擇器</span>
        </div>
        <button id="backHomeBtn" class="back-home" type="button">← 回首頁</button>
      </div>
    </header>

    <main>
      <section id="homeView" class="view active" aria-labelledby="homeTitle">
        <div class="hero">
          <div class="eyebrow">🎯 不必糾結，交給隨機</div>
          <h1 id="homeTitle">人生選擇器</h1>
          <p>選不出來？那就交給命運吧。</p>
        </div>

        <div class="tool-grid" aria-label="隨機工具">
          <article class="tool-card" data-target="wheelView" tabindex="0" role="button" aria-label="進入命運輪盤">
            <div class="card-icon" aria-hidden="true">🎡</div>
            <h2>命運輪盤</h2>
            <p>有很多選項？全部放進輪盤裡。</p>
            <button class="card-action" type="button" data-target="wheelView">開始轉輪盤</button>
          </article>

          <article class="tool-card" data-target="diceView" tabindex="0" role="button" aria-label="進入骰子">
            <div class="card-icon" aria-hidden="true">🎲</div>
            <h2>骰子</h2>
            <p>不需要理由，只需要一個隨機數字。</p>
            <button class="card-action" type="button" data-target="diceView">擲骰子</button>
          </article>

          <article class="tool-card" data-target="coinView" tabindex="0" role="button" aria-label="進入命運硬幣">
            <div class="card-icon" aria-hidden="true">🪙</div>
            <h2>命運硬幣</h2>
            <p>只有兩個選項？交給正面與反面。</p>
            <button class="card-action" type="button" data-target="coinView">擲硬幣</button>
          </article>
        </div>
      </section>

      <section id="wheelView" class="view tool-page" aria-labelledby="wheelTitle">
        <div class="page-title">
          <div class="emoji" aria-hidden="true">🎡</div>
          <h1 id="wheelTitle">命運輪盤</h1>
          <p>把選項都放進去，讓指針替你決定。</p>
        </div>

        <div class="wheel-layout">
          <div class="panel">
            <label class="input-label" for="wheelInput">輸入一個選項</label>
            <div class="input-row">
              <input id="wheelInput" class="text-input" type="text" maxlength="28" placeholder="例如：壽司郎" autocomplete="off" />
              <button id="addOptionBtn" class="primary-btn" type="button">＋ 新增</button>
            </div>
            <div id="wheelNote" class="inline-note" aria-live="polite">目前 0 / 10 個選項</div>
            <div id="optionList" class="option-list" aria-label="輪盤選項">
              <div class="empty-state">還沒有選項，先加入至少兩個吧。</div>
            </div>
          </div>

          <div class="panel wheel-panel">
            <div class="wheel-wrap" aria-label="命運輪盤">
              <canvas id="wheelCanvas" width="600" height="600"></canvas>
              <div class="wheel-pointer" aria-hidden="true"></div>
              <div class="wheel-hub" aria-hidden="true">✦</div>
            </div>
            <div class="wheel-actions">
              <button id="spinWheelBtn" class="primary-btn" type="button">🎡 開始轉動</button>
            </div>
          </div>
        </div>
      </section>

      <section id="diceView" class="view tool-page" aria-labelledby="diceTitle">
        <div class="page-title">
          <div class="emoji" aria-hidden="true">🎲</div>
          <h1 id="diceTitle">骰子</h1>
          <p>需要 1～6 的答案？擲一次就知道。</p>
        </div>

        <div class="panel center-card">
          <div class="dice-stage">
            <div id="dice" class="dice" aria-label="骰子，目前點數 1">
              <span class="pip" data-pos="1"></span>
              <span class="pip" data-pos="2"></span>
              <span class="pip" data-pos="3"></span>
              <span class="pip" data-pos="4"></span>
              <span class="pip" data-pos="5"></span>
              <span class="pip" data-pos="6"></span>
              <span class="pip" data-pos="7"></span>
              <span class="pip" data-pos="8"></span>
              <span class="pip" data-pos="9"></span>
            </div>
            <button id="rollDiceBtn" class="primary-btn" type="button">🎲 擲骰子</button>
            <div id="diceResult" class="result-card" aria-live="polite">
              <p class="result-kicker">🎲 你擲出了</p>
              <div id="diceResultValue" class="result-value">1</div>
              <button id="rollDiceAgainBtn" class="secondary-btn" type="button">再擲一次</button>
            </div>
          </div>
        </div>
      </section>

      <section id="coinView" class="view tool-page" aria-labelledby="coinTitle">
        <div class="page-title">
          <div class="emoji" aria-hidden="true">🪙</div>
          <h1 id="coinTitle">命運硬幣</h1>
          <p>只有兩個選項？讓正面與反面替你決定。</p>
        </div>

        <div class="panel center-card">
          <div class="coin-inputs">
            <div>
              <label class="input-label" for="headsInput">正面代表</label>
              <input id="headsInput" class="text-input" type="text" maxlength="30" value="YES" placeholder="例如：往左" autocomplete="off" />
            </div>
            <div>
              <label class="input-label" for="tailsInput">反面代表</label>
              <input id="tailsInput" class="text-input" type="text" maxlength="30" value="NO" placeholder="例如：往右" autocomplete="off" />
            </div>
          </div>

          <div class="coin-stage">
            <div class="coin-scene" aria-label="命運硬幣">
              <div id="coin" class="coin">
                <div class="coin-side coin-front">
                  <div class="coin-face-inner" aria-hidden="true">正</div>
                </div>
                <div class="coin-side coin-back">
                  <div class="coin-face-inner" aria-hidden="true">反</div>
                </div>
              </div>
            </div>
            <button id="flipCoinBtn" class="primary-btn" type="button">🪙 擲硬幣</button>
            <div id="coinResult" class="result-card" aria-live="polite">
              <p id="coinResultName" class="coin-result-name">🪙 正面</p>
              <div id="coinResultChoice" class="coin-result-choice">YES</div>
              <button id="flipCoinAgainBtn" class="secondary-btn" type="button">再擲一次</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">人生選擇器僅供日常娛樂與低風險選擇使用。</footer>
  </div>

  <div id="wheelModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="wheelModalTitle">
    <div class="modal">
      <div class="modal-emoji" aria-hidden="true">🎉</div>
      <h3 id="wheelModalTitle">命運選擇了</h3>
      <div id="wheelModalResult" class="modal-result">—</div>
      <div class="modal-actions">
        <button id="acceptFateBtn" class="ghost-btn" type="button">接受命運</button>
        <button id="spinAgainBtn" class="primary-btn" type="button">再轉一次</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      'use strict';

      // ---------- View navigation ----------
      const views = [...document.querySelectorAll('.view')];
      const backHomeBtn = document.getElementById('backHomeBtn');
      let activeView = 'homeView';

      function showView(id) {
        views.forEach(view => view.classList.toggle('active', view.id === id));
        activeView = id;
        backHomeBtn.classList.toggle('show', id !== 'homeView');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      document.querySelectorAll('[data-target]').forEach(el => {
        el.addEventListener('click', event => {
          event.stopPropagation();
          showView(el.dataset.target);
        });

        if (el.classList.contains('tool-card')) {
          el.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              showView(el.dataset.target);
            }
          });
        }
      });

      backHomeBtn.addEventListener('click', () => showView('homeView'));

      // ---------- Wheel ----------
      const wheelInput = document.getElementById('wheelInput');
      const addOptionBtn = document.getElementById('addOptionBtn');
      const optionList = document.getElementById('optionList');
      const wheelNote = document.getElementById('wheelNote');
      const spinWheelBtn = document.getElementById('spinWheelBtn');
      const wheelCanvas = document.getElementById('wheelCanvas');
      const ctx = wheelCanvas.getContext('2d');
      const wheelModal = document.getElementById('wheelModal');
      const wheelModalResult = document.getElementById('wheelModalResult');
      const acceptFateBtn = document.getElementById('acceptFateBtn');
      const spinAgainBtn = document.getElementById('spinAgainBtn');

      const wheelColors = [
        '#7257ff', '#ff7eb6', '#56c7d9', '#f4b95f', '#8dd17e',
        '#9b78ff', '#ff9b73', '#5aa9ff', '#d978d4', '#76c6a3'
      ];

      let wheelOptions = [];
      let wheelRotation = 0;
      let wheelAnimating = false;

      const TAU = Math.PI * 2;
      const normalizeAngle = angle => ((angle % TAU) + TAU) % TAU;

      function setWheelNote(message = '', type = '') {
        wheelNote.textContent = message || `目前 ${wheelOptions.length} / 10 個選項`;
        wheelNote.className = `inline-note${type ? ` ${type}` : ''}`;
      }

      function renderOptions() {
        optionList.innerHTML = '';

        if (wheelOptions.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty-state';
          empty.textContent = '還沒有選項，先加入至少兩個吧。';
          optionList.appendChild(empty);
        } else {
          wheelOptions.forEach((option, index) => {
            const item = document.createElement('div');
            item.className = 'option-item';

            const name = document.createElement('span');
            name.className = 'option-name';
            name.textContent = option;
            name.title = option;

            const del = document.createElement('button');
            del.className = 'delete-option';
            del.type = 'button';
            del.setAttribute('aria-label', `刪除 ${option}`);
            del.textContent = '×';
            del.disabled = wheelAnimating;
            del.addEventListener('click', () => {
              if (wheelAnimating) return;
              wheelOptions.splice(index, 1);
              renderOptions();
              drawWheel(wheelRotation);
              setWheelNote();
            });

            item.append(name, del);
            optionList.appendChild(item);
          });
        }

        addOptionBtn.disabled = wheelAnimating;
        wheelInput.disabled = wheelAnimating;
        spinWheelBtn.disabled = wheelAnimating;
      }

      function addWheelOption() {
        if (wheelAnimating) return;
        const value = wheelInput.value.trim();

        if (!value) {
          setWheelNote('請先輸入一個選項。', 'error');
          wheelInput.focus();
          return;
        }

        if (wheelOptions.length >= 10) {
          setWheelNote('最多只能加入 10 個選項。', 'error');
          return;
        }

        wheelOptions.push(value);
        wheelInput.value = '';
        renderOptions();
        drawWheel(wheelRotation);
        setWheelNote(`已加入「${value}」`, 'success');
        setTimeout(() => {
          if (!wheelAnimating) setWheelNote();
        }, 1100);
        wheelInput.focus();
      }

      addOptionBtn.addEventListener('click', addWheelOption);
      wheelInput.addEventListener('keydown', event => {
        if (event.key === 'Enter') addWheelOption();
      });

      function wrapCanvasText(text, maxChars) {
        if (text.length <= maxChars) return [text];
        return [text.slice(0, maxChars - 1) + '…'];
      }

      function drawWheel(rotation = 0) {
        const size = wheelCanvas.width;
        const center = size / 2;
        const radius = size * 0.455;
        ctx.clearRect(0, 0, size, size);

        // Back plate
        ctx.beginPath();
        ctx.arc(center, center, radius + 15, 0, TAU);
        ctx.fillStyle = '#ffffff';
        ctx.fill();

        if (wheelOptions.length === 0) {
          ctx.beginPath();
          ctx.arc(center, center, radius, 0, TAU);
          const grad = ctx.createRadialGradient(center - 80, center - 80, 30, center, center, radius);
          grad.addColorStop(0, '#f4f1ff');
          grad.addColorStop(1, '#ddd7f7');
          ctx.fillStyle = grad;
          ctx.fill();

          ctx.fillStyle = '#746e8b';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.font = '800 29px system-ui, sans-serif';
          ctx.fillText('加入選項', center, center - 62);
          ctx.font = '600 20px system-ui, sans-serif';
          ctx.fillText('至少 2 個選項才能開始', center, center + 62);
          return;
        }

        const arc = TAU / wheelOptions.length;

        wheelOptions.forEach((option, index) => {
          const start = rotation - Math.PI / 2 + index * arc;
          const end = start + arc;

          ctx.beginPath();
          ctx.moveTo(center, center);
          ctx.arc(center, center, radius, start, end);
          ctx.closePath();
          ctx.fillStyle = wheelColors[index % wheelColors.length];
          ctx.fill();

          ctx.save();
          ctx.translate(center, center);
          ctx.rotate(start + arc / 2);
          ctx.textAlign = 'right';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = 'rgba(28, 20, 58, .22)';
          ctx.shadowBlur = 4;

          const fontSize = wheelOptions.length >= 8 ? 20 : wheelOptions.length >= 6 ? 23 : 27;
          ctx.font = `850 ${fontSize}px system-ui, sans-serif`;
          const maxChars = wheelOptions.length >= 8 ? 7 : wheelOptions.length >= 6 ? 8 : 10;
          const [display] = wrapCanvasText(option, maxChars);
          ctx.fillText(display, radius - 30, 0);
          ctx.restore();
        });

        // Segment lines
        ctx.save();
        ctx.translate(center, center);
        ctx.strokeStyle = 'rgba(255,255,255,.72)';
        ctx.lineWidth = 4;
        for (let i = 0; i < wheelOptions.length; i++) {
          const angle = rotation - Math.PI / 2 + i * arc;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
          ctx.stroke();
        }
        ctx.restore();

        // Outer ring
        ctx.beginPath();
        ctx.arc(center, center, radius, 0, TAU);
        ctx.lineWidth = 8;
        ctx.strokeStyle = 'rgba(255,255,255,.95)';
        ctx.stroke();
      }

      function setWheelControlsDisabled(disabled) {
        wheelAnimating = disabled;
        spinWheelBtn.disabled = disabled;
        addOptionBtn.disabled = disabled;
        wheelInput.disabled = disabled;
        optionList.querySelectorAll('button').forEach(btn => btn.disabled = disabled);
      }

      function openWheelModal(option) {
        wheelModalResult.textContent = option;
        wheelModal.classList.add('open');
        acceptFateBtn.focus();
      }

      function closeWheelModal() {
        wheelModal.classList.remove('open');
      }

      function spinWheel() {
        if (wheelAnimating) return;
        if (wheelOptions.length < 2) {
          setWheelNote('請至少加入兩個選項！', 'error');
          wheelInput.focus();
          return;
        }

        closeWheelModal();
        setWheelControlsDisabled(true);
        setWheelNote('命運正在思考中…');

        const selectedIndex = Math.floor(Math.random() * wheelOptions.length);
        const arc = TAU / wheelOptions.length;
        const desiredMod = normalizeAngle(-(selectedIndex + 0.5) * arc);
        const currentMod = normalizeAngle(wheelRotation);
        const deltaToTarget = normalizeAngle(desiredMod - currentMod);
        const fullTurns = 6 + Math.floor(Math.random() * 3);
        const startRotation = wheelRotation;
        const totalDelta = fullTurns * TAU + deltaToTarget;
        const duration = 3900 + Math.random() * 700;
        const startTime = performance.now();

        function easeOutQuart(t) {
          return 1 - Math.pow(1 - t, 4);
        }

        function frame(now) {
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const eased = easeOutQuart(progress);
          wheelRotation = startRotation + totalDelta * eased;
          drawWheel(wheelRotation);

          if (progress < 1) {
            requestAnimationFrame(frame);
          } else {
            wheelRotation = startRotation + totalDelta;
            drawWheel(wheelRotation);
            setWheelControlsDisabled(false);
            setWheelNote();
            openWheelModal(wheelOptions[selectedIndex]);
          }
        }

        requestAnimationFrame(frame);
      }

      spinWheelBtn.addEventListener('click', spinWheel);
      spinAgainBtn.addEventListener('click', () => {
        closeWheelModal();
        setTimeout(spinWheel, 70);
      });
      acceptFateBtn.addEventListener('click', closeWheelModal);
      wheelModal.addEventListener('click', event => {
        if (event.target === wheelModal && !wheelAnimating) closeWheelModal();
      });

      // ---------- Dice ----------
      const dice = document.getElementById('dice');
      const pips = [...dice.querySelectorAll('.pip')];
      const rollDiceBtn = document.getElementById('rollDiceBtn');
      const rollDiceAgainBtn = document.getElementById('rollDiceAgainBtn');
      const diceResult = document.getElementById('diceResult');
      const diceResultValue = document.getElementById('diceResultValue');
      let diceRolling = false;

      const diceMap = {
        1: [5],
        2: [1, 9],
        3: [1, 5, 9],
        4: [1, 3, 7, 9],
        5: [1, 3, 5, 7, 9],
        6: [1, 3, 4, 6, 7, 9]
      };

      function showDiceFace(value) {
        const visible = new Set(diceMap[value]);
        pips.forEach(pip => {
          pip.classList.toggle('show', visible.has(Number(pip.dataset.pos)));
        });
        dice.setAttribute('aria-label', `骰子，目前點數 ${value}`);
      }

      function rollDice() {
        if (diceRolling) return;
        diceRolling = true;
        diceResult.classList.remove('show');
        rollDiceBtn.disabled = true;
        rollDiceAgainBtn.disabled = true;
        dice.classList.add('rolling');

        const finalValue = 1 + Math.floor(Math.random() * 6);
        const started = performance.now();
        let lastSwap = 0;

        function animate(now) {
          if (now - lastSwap > 85) {
            showDiceFace(1 + Math.floor(Math.random() * 6));
            lastSwap = now;
          }

          if (now - started < 1500) {
            requestAnimationFrame(animate);
          } else {
            dice.classList.remove('rolling');
            showDiceFace(finalValue);
            diceResultValue.textContent = finalValue;
            diceResult.classList.add('show');
            rollDiceBtn.disabled = false;
            rollDiceAgainBtn.disabled = false;
            diceRolling = false;
          }
        }

        requestAnimationFrame(animate);
      }

      rollDiceBtn.addEventListener('click', rollDice);
      rollDiceAgainBtn.addEventListener('click', rollDice);
      showDiceFace(1);

      // ---------- Coin ----------
      const coin = document.getElementById('coin');
      const headsInput = document.getElementById('headsInput');
      const tailsInput = document.getElementById('tailsInput');
      const flipCoinBtn = document.getElementById('flipCoinBtn');
      const flipCoinAgainBtn = document.getElementById('flipCoinAgainBtn');
      const coinResult = document.getElementById('coinResult');
      const coinResultName = document.getElementById('coinResultName');
      const coinResultChoice = document.getElementById('coinResultChoice');
      let coinFlipping = false;
      let coinRotation = 0;

      function flipCoin() {
        if (coinFlipping) return;
        coinFlipping = true;
        coinResult.classList.remove('show');
        flipCoinBtn.disabled = true;
        flipCoinAgainBtn.disabled = true;
        headsInput.disabled = true;
        tailsInput.disabled = true;

        const isHeads = Math.random() < 0.5;
        const desired = isHeads ? 0 : 180;
        const current = ((coinRotation % 360) + 360) % 360;
        const delta = ((desired - current + 360) % 360) + 1800;
        coinRotation += delta;
        coin.style.transform = `rotateY(${coinRotation}deg)`;

        window.setTimeout(() => {
          const headsChoice = headsInput.value.trim() || '正面';
          const tailsChoice = tailsInput.value.trim() || '反面';
          coinResultName.textContent = isHeads ? '🪙 正面' : '🪙 反面';
          coinResultChoice.textContent = isHeads ? headsChoice : tailsChoice;
          coinResult.classList.add('show');

          flipCoinBtn.disabled = false;
          flipCoinAgainBtn.disabled = false;
          headsInput.disabled = false;
          tailsInput.disabled = false;
          coinFlipping = false;
        }, 1580);
      }

      flipCoinBtn.addEventListener('click', flipCoin);
      flipCoinAgainBtn.addEventListener('click', flipCoin);

      // ---------- Global keyboard handling ----------
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && wheelModal.classList.contains('open')) {
          closeWheelModal();
        }
      });

      // Initial renders
      drawWheel();
      renderOptions();
      setWheelNote();
    })();
  </script>
</body>
</html>
